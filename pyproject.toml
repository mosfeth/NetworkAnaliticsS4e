[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supadiag"
version = "0.1.0"
description = "Monitoramento de latência e jitter com Supabase"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "supabase>=2.6,<3",
    "streamlit>=1.60,<2",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0",
    "scikit-learn>=1.3",
    "fastai>=2.7",
]
tui = [
    "textual>=0.50,<2",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
supadiag = "supadiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
